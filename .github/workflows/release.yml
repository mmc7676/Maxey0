# Publishing a GitHub release builds the sdist and wheel once, uploads them to
# PyPI through Trusted Publishing (no API token is stored anywhere), and
# attaches the same two files to the release.
#
# One-time setup on PyPI, by the project owner: pypi.org -> maxey0 -> Manage ->
# Publishing -> add a GitHub publisher with owner "mmc7676", repository
# "Maxey0", workflow "release.yml" and environment "pypi".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # A release tagged v0.3.2 must not publish a package that says 0.3.1.
      - name: Tag matches the package version
        run: |
          version=$(python -c "import pathlib, re; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('maxey0_ss/__init__.py').read_text(encoding='utf-8'), re.M).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match maxey0_ss.__version__ $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          # The built files must carry the tag's version: proves the dynamic
          # version resolved to the same literal the check above read.
          ls dist/maxey0-"${GITHUB_REF_NAME#v}"-py3-none-any.whl dist/maxey0-"${GITHUB_REF_NAME#v}".tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/maxey0/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
