# Generated by scripts/build_distributions.py. Append to ~/.codex/config.toml
#
# Codex reads MCP servers from this file. The stdio entry point is the
# same surface the HTTP transport serves -- one definition, two
# transports, so a tool cannot exist in one and not the other.

[mcp_servers.maxey0_ss]
command = "python"
args = ["-m", "maxey0_ss.mcp_stdio_server"]

[mcp_servers.maxey0_ss.env]
PYTHONUNBUFFERED = "1"
