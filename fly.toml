# Fly.io configuration for the Maxey0-SuperSpace Python origin.
# Image: Dockerfile. Runbook: docs/FLY_DEPLOYMENT.md.
#
# The two values below are the maintainer's to choose. Both are deliberately
# invalid (Fly app names and region codes are lower case), so `fly deploy`
# refuses to run until they are replaced.
app = "CHANGE-ME-fly-app-name"
primary_region = "CHANGE-ME-region"

# deploy/entrypoint.sh stops cloudflared first (a 20 s --grace-period for
# in-flight requests, killed at 25 s), then the origin (killed at 10 s). 40
# covers both with slack; less and Fly would KILL the Machine mid-drain.
kill_signal = "SIGTERM"
kill_timeout = 40

[build]
  dockerfile = "Dockerfile"

# There is no [http_service] and no [[services]] section, on purpose. Without
# one, Fly gives the Machine no public address and no Flycast address: the only
# way in is the Cloudflare Tunnel that cloudflared dials OUT from inside the
# Machine, serving origin.maxey0.com. Adding a service here would open a second
# door that bypasses Cloudflare.

# Exactly one Machine, updated in place. The origin keeps its attestation hash
# chain, MCP sessions and tasks in memory, and every Machine runs a tunnel
# connector: two Machines would be two connectors for origin.maxey0.com, and
# Cloudflare would split requests -- and therefore that state -- between them.
# `bluegreen` and `canary` both boot a second Machine; Fly also refuses both for
# Machines with volumes. Deploy with `fly deploy --ha=false`.
[deploy]
  strategy = "rolling"

# Non-secret defaults, the same as the Dockerfile's.
#
# Secrets are NEVER written here. Set them with `fly secrets set`, which stores
# them encrypted and injects them as environment variables at boot:
#   TUNNEL_TOKEN              the remotely-managed Cloudflare Tunnel's token.
#   MAXEY0_MCP_TOKEN_HASHES   bearer credentials as digests, comma separated:
#                             sha256:<hex>:<role>:<label> (scripts/mint_token.py).
#   MAXEY0_A2A_SHARED_SECRET  only if /v1/a2a/message is used.
#   provider API keys         only if a provider tool is used on this origin.
# Do not use MAXEY0_MCP_TOKENS here: it holds bearer tokens in plaintext, so
# every copy of the Machine's environment would be a working credential.
[env]
  MAXEY0_HOST = "127.0.0.1"
  MAXEY0_PORT = "8765"
  MAXEY0_ENV = "production"
  MAXEY0_PUBLIC = "1"
  MAXEY0_AUTH_MODE = "bearer"
  SCW_HOME = "/data/scw"

# The only state that outlives a restart is under SCW_HOME. The core (SCWs,
# sessions, tasks, the attestation chain) is in memory and starts empty on
# every boot and every deploy.
[mounts]
  source = "maxey0_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# The entrypoint exits non-zero when either process dies; restart regardless.
[[restart]]
  policy = "always"
